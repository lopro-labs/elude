# Cache policy by path. Set once at server level (an add_header inside a location would
# discard the server-level headers, including the security ones below).
map $uri $elude_cache_control {
    default            "no-cache";
    ~^/assets/         "public, max-age=31536000, immutable";
    ~^/og\.png$        "public, max-age=86400";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/octet-stream image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    add_header Cache-Control $elude_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Geolocation is the app's core permission; everything else is off.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;

    # Hashed build assets.
    location /assets/ {
        try_files $uri =404;
    }

    # API is proxied to the api service (docker-compose network).
    location /api/ {
        proxy_pass http://api:3210/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nDisallow: /api/\n";
    }

    location = /sw.js {
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
